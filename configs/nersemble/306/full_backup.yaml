# Debug and experimental features
exp:
  logging:
    silent: false        # 完全静默：true=静音（不落图/不保存可视化）
    selective: false     # 选择性静默：true=只抑制J1/J2可视化，保留原始训练可视化
    mute_print: false    # 若也想静音控制台，设 true
  
  debug_run:
    enable: true
    max_steps: 1000
    gradcheck_j1: False  # 梯度归属检查开关
    j2_uv_prereq: True   # J2 UV预检开关
    j2_uv_bake: False    # J2 UV烘回开关
    show_loss_breakdown: true  # 显示损失分解开关
  
  lf_uv:
    enable: true
    uv_res: 1024         # 作为兜底数值；自动取到 T_di 时会显示 src=T_di
    force_bake_now: true # 冒烟
    vis_every: 10000    # 每隔多少步保存一次可视化
    loss:
      enable: true
      type: "charbonnier"  # 可选 "l1"|"deltae"
      colorspace: "rgb"     # 当 type=="deltae" 时切到 "lab"
      gaussian_kernel: 7
      gaussian_sigma: 1.2
      weight: 0.05
      vis_mask_min_cov: 0.02  # 掩膜覆盖率过低则本步跳过
    seam:
      enable: false     # 默认关闭
      weight: 0.0       # 默认不计入总损失
      band_px: 2         # 窄带宽度（像素）
      tv_type: "l1"     # "l1" | "charbonnier"
      edge: "sobel"     # 边缘检测方法（先支持 "sobel"）
      edge_tau: 0.05    # 边缘幅值阈值（0~1），太低会过宽
      min_cov: 0.02     # 可见UV占比过低时跳过
      vis_every: 10000  # 每隔多少步保存一次可视化
  
  lf_img:
    enable: true
    kernel: 5           # 先用 5，真实使用时可通过 CLI 覆写
    loss: charbonnier   # 可选 l1
    lambda: 0.1         # joint 期谨慎起步；后续再评估是否提高